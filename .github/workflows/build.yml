name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache payloads
        uses: actions/cache@v6
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libghostlock.so
            app/src/main/assets/profiles/bakasu/ksud
            app/src/main/assets/profiles/bakasu/bakasu-sparrow-targetcfg.ko
          key: payloads-${{ hashFiles('payloads/manifest.json') }}

      - name: Fetch pinned payloads
        env:
          GHOSTLOCK_PAYLOAD_URL: ${{ vars.GHOSTLOCK_PAYLOAD_URL || 'https://github.com/aeongdesu/ghostlock-app_sparrow/releases/download/pre-release' }}
          BAKASU_PAYLOAD_URL: ${{ vars.BAKASU_PAYLOAD_URL || 'https://github.com/aeongdesu/BakaSU_sparrow/releases/latest/download' }}
        run: |
          if ./payloads/fetch.sh --check; then
            echo "payloads restored from cache"
          else
            ./payloads/fetch.sh
          fi

      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.p12
            export KEYSTORE_PATH="$PWD/release.p12"
            export KEYSTORE_PASS="$KEYSTORE_PASSWORD"
          fi
          ./gradlew :app:assembleCtsRelease --no-daemon

      - name: Verify signing
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort | tail -1)"
          "$APKSIGNER" verify --print-certs \
            app/build/outputs/apk/cts/release/app-cts-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: NestLock
          path: app/build/outputs/apk/cts/release/app-cts-release.apk
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: ${{ success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.ref_type != 'tag' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: NestLock
          path: dist

      - name: Prepare release file
        run: |
          cd dist
          mv app-cts-release.apk NestLock.apk
          sha256sum NestLock.apk

      - name: Attest APK
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/NestLock.apk

      - name: Upload pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: pre-release
          target_commitish: ${{ github.sha }}
          name: NestLock Pre-release
          body: |
            > Generated by the NestLock build workflow
            verify a download with:
            `gh attestation verify <file> --repo aeongdesu/NestLock`

            built from ${{ github.sha }}
          files: |
            dist/NestLock.apk
          fail_on_unmatched_files: true
          prerelease: true
